<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arepas de la Casa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/registro.css">
    <link rel="stylesheet" href="css/baner2.css">
    <link rel="icon" type="image/webp" href="img/iconos/arepa.png">
</head>
<body>
    <header class="header">
         <div class="contenedor-header">
            <a href="index.html" class="logo">Arepas <br class="salto-movil">de la Casa</a>
            <div class="buscador">
                <input type="text" id="buscador" placeholder="Buscar producto">
                <button type="button" id="btn-buscar">
                    <img src="img/iconos/lupa.png" alt="Buscar" class="icono">
                </button>
                <ul id="lista-sugerencias" class="lista-sugerencias"></ul>
            </div>
            <button type="button" class="btn-hamburguesa" id="btn-hamburguesa">
                <img src="img/iconos/lista.png" alt="hamburguesa" class="icono">
            </button>
            <div class="acciones" id="acciones-menu">
                <a href="menu.html" class="menu">Menú</a>
                <button type="button" class="btn-carrito" id="btn-carrito">
                    <img src="img/iconos/carrito-de-compras.png" alt="Carrito" class="icono">
                    <span id="carri-text">Carrito</span>
                    <span id="contador-carrito">0</span>
                </button>
                <button type="button" class="btn-login" id="btn-login">Iniciar sesión</button>
            </div>
        </div>
    </header>
    <section class="hero-2"></section>
    <main>
       <main>
            <form id="form-registro" class="tarjeta-registro">
                <h2>Crear Cuenta</h2>
                <div class="avatar-header">
                    <img src="img/iconos/detective.gif" alt="Detective" class="icono-detective">
                </div>
                <div class="grupo-input">
                    <label for="reg-nombre">Nombre completo *</label>
                    <input type="text" id="reg-nombre" required placeholder="Ej: María Gómez">
                </div>
                <div class="grupo-input">
                    <label for="reg-foto">Foto de perfil *</label>
                    <input type="file" id="reg-foto" accept="image/*" required>
                </div>
                <div class="grupo-input">
                    <label for="reg-correo">Correo electrónico *</label>
                    <input type="email" id="reg-correo" required placeholder="correo@ejemplo.com">
                </div>
                <div class="grupo-input">
                    <label for="reg-celular">Celular *</label>
                    <input type="tel" id="reg-celular" required placeholder="3001234567">
                </div>
                <div class="grupo-input">
                    <label for="reg-direccion">Dirección *</label>
                    <input type="text" id="reg-direccion" required placeholder="Calle 45 # 12-34">
                </div>
                <div class="grupo-input">
                    <label for="reg-metodo-pago">Método de pago preferido *</label>
                    <select id="reg-metodo-pago" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="nequi">Nequi / Daviplata</option>
                        <option value="tarjeta">Tarjeta Débito / Crédito</option>
                    </select>
                </div>
                <div class="grupo-input">
                    <label for="reg-password">Contraseña *</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-registro">Registrarse</button>
                <p class="texto-login">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </form>
        </section>
    </main>
    </main>
    <footer class="footer">
        <p>© 2026 Arepas de la Casa. Todos los derechos reservados.</p>
        <div class="redes">
            <a href="#" aria-label="X">𝕏</a>
            <a href="#" aria-label="Facebook">f</a>
            <a href="#" aria-label="Instagram">◎</a>
        </div>
    </footer>
    <script src="javascript/script.js"></script>
    <script src="javascript/registro.js"></script>
</body>
</html>
