<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volaris - Explorar Viajes</title>
    <link rel="icon" type="image/webp" href="assets/iconos/icon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4 px-lg-5">
            <a href="index.html" class="navbar-brand logo-link d-flex align-items-center gap-2">
                <img src="/volaris/frontend/assets/iconos/icon.png" alt="Logo Volaris" width="35" height="35" class="d-inline-block align-text-top">
                <span class="fw-bold fs-4 text-dark">Volaris</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVolaris" aria-controls="navbarVolaris" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarVolaris">
                <nav class="nav-links ms-auto d-flex flex-column flex-lg-row align-items-center align-items-lg-center justify-content-center justify-content-lg-end text-center text-lg-start gap-3 gap-lg-4 pb-3 pb-lg-0">
                    <a href="/volaris/frontend/viajes.html" class="nav-link-custom active text-nowrap" >Explorar Viajes</a>
                    <a href="/volaris/frontend/pqr.html" class="nav-link-custom text-nowrap">Soporte y Reseñas</a>
                    <a href="/volaris/frontend/tendencias.html" class="nav-link-custom text-nowrap">Tendencias</a>
                    <div id="user-session-container" class="ms-lg-2">
                        <a href="login.html" class="btn btn-volaris px-4 fw-semibold text-nowrap" id="btn-login">Iniciar sesión</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="container py-5 text-center">
        <h1 class="fw-bold mb-4">Planea tu viaje</h1>
        
        <form id="form-buscador" class="row g-3 justify-content-center text-start align-items-end">
            <div class="col-12 col-md-3 position-relative">
                <label for="buscar-destino" class="form-label fw-medium text-muted">¿A dónde quieres ir?*</label>
                <input type="text" id="buscar-destino" class="form-control border-danger py-2" placeholder="Explorar viajes" autocomplete="off" required>
                <ul id="lista-sugerencias" class="list-group position-absolute start-0 w-100 shadow mt-1 d-none" style="z-index: 1050; max-height: 200px; overflow-y: auto;"></ul>
            </div>

            <div class="col-12 col-md-3">
                <label for="buscar-fecha" class="form-label fw-medium text-muted">¿Qué fechas tienes en mente?*</label>
                <input type="date" id="buscar-fecha" class="form-control border-danger py-2" required>
            </div>

            <div class="col-12 col-md-3 position-relative">
                <label class="form-label fw-medium text-muted">¿Quién va a ir?</label>
                <button type="button" id="btn-pasajeros-dropdown" class="form-control border-danger py-2 text-start d-flex align-items-center gap-2 bg-white">
                    <i class="fas fa-user-friends text-muted"></i>
                    <span id="texto-pasajeros-resumen" class="fw-semibold text-dark">1 pasajero</span>
                </button>
                <input type="hidden" id="buscar-pasajeros" value="1">
                <div id="popover-pasajeros" class="card position-absolute start-0 w-100 shadow-lg mt-1 p-3 d-none rounded-4 border-0" style="z-index: 1050; min-width: 280px;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <p class="mb-0 fw-bold text-dark">Adultos</p>
                            <small class="text-muted">Desde 12 años</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-light rounded-circle p-0 d-flex align-items-center justify-content-center" id="btn-restar-adultos" style="width: 32px; height: 32px;">-</button>
                            <span id="cant-adultos" class="fw-bold px-2">1</span>
                            <button type="button" class="btn btn-light rounded-circle p-0 d-flex align-items-center justify-content-center" id="btn-sumar-adultos" style="width: 32px; height: 32px;">+</button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <p class="mb-0 fw-bold text-dark">Menores</p>
                            <small class="text-muted">Hasta 11 años</small>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-light rounded-circle p-0 d-flex align-items-center justify-content-center" id="btn-restar-menores" style="width: 32px; height: 32px;">-</button>
                            <span id="cant-menores" class="fw-bold px-2">0</span>
                            <button type="button" class="btn btn-light rounded-circle p-0 d-flex align-items-center justify-content-center" id="btn-sumar-menores" style="width: 32px; height: 32px;">+</button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                        <button type="button" id="btn-cancelar-pasajeros" class="btn btn-link text-danger text-decoration-none fw-semibold p-0">Cancelar</button>
                        <button type="button" id="btn-aplicar-pasajeros" class="btn btn-danger btn-sm px-3 fw-bold rounded-3">Aplicar</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-2">
                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Buscar</button>
            </div>
        </form>
    </section>

    <section class="container my-4">
        <h3 class="fw-bold mb-4">Planes sugeridos</h3>
        
        <div id="carruselPlanes" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2800">
            <div class="carousel-inner" id="contenedor-viajes">
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carruselPlanes" data-bs-slide="prev">
                <span class="carousel-control-prev-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carruselPlanes" data-bs-slide="next">
                <span class="carousel-control-next-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
    </section>
    </main>
    <footer class="footer mt-auto py-4 bg-light text-center text-muted">
        <div class="container">
            <div class="social-links d-flex justify-content-center align-items-center gap-3 mb-3">
                <span class="fw-semibold me-1">Follow us</span>
                <a href="https://www.instagram.com/__mjtx707/" target="_blank" class="social-icon"><i class="fab fa-instagram fs-4"></i></a>
                <a href="https://www.linkedin.com/in/mj-ospina707/" target="_blank" class="social-icon"><i class="fab fa-linkedin fs-4"></i></a>
            </div>
            <hr class="w-75 mx-auto my-3 text-secondary opacity-25">
            <div class="footer-info small">
                <p class="mb-1">Cali, Colombia</p>
                <p class="mb-0">&copy; 2026 Doofenshmirtz malvados S.A. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/script.js"></script>
    <script src="js/viajes.js"></script>
</body>
</html>
