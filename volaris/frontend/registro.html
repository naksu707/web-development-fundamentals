<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/registro.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4 px-lg-5">
            <a href="index.html" class="navbar-brand logo-link d-flex align-items-center gap-2">
                <img src="/volaris/frontend/assets/iconos/icon.png" alt="Logo Volaris" width="35" height="35" class="d-inline-block align-text-top">
                <span class="fw-bold fs-4 text-dark">Volaris</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVolaris" aria-controls="navbarVolaris" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarVolaris">
                <nav class="nav-links ms-auto d-flex flex-column flex-lg-row align-items-center align-items-lg-center justify-content-center justify-content-lg-end text-center text-lg-start gap-3 gap-lg-4 pb-3 pb-lg-0">

                    <div id="user-session-container" class="ms-lg-2">
                        <a href="login.html" class="btn btn-volaris px-4 fw-semibold text-nowrap" id="btn-login">Iniciar sesión</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main class="flex-grow-1 py-5">
        <div class="container">
            <h2 class="text-center fw-bold mb-5">Crea tu cuenta</h2>

            <form id="registro-form" class="mx-auto" style="max-width: 900px;" enctype="multipart/form-data" novalidate>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label fw-semibold">Ingresa tu nombre*</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Carla" required>
                    </div>
                    <div class="col-md-6">
                        <label for="apellido" class="form-label fw-semibold">Ingresa tus apellidos*</label>
                        <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Perez Lopez" required>
                    </div>
                    <div class="col-md-6">
                        <label for="tipo_doc" class="form-label fw-semibold">Selecciona tu tipo de documento*</label>
                        <select class="form-select" id="tipo_doc" name="tipo_doc" required>
                            <option value="" selected disabled>Seleccionar un tipo</option>
                            <option value="CC">Cédula de ciudadanía (CC)</option>
                            <option value="CE">Cédula de extranjería (CE)</option>
                            <option value="PASAPORTE">Pasaporte</option>
                            <option value="NIT">NIT (Número de Identificación Tributaria)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="numero_doc" class="form-label fw-semibold">Ingresa el número de documento*</label>
                        <input type="text" class="form-control" id="numero_doc" name="numero_doc" placeholder="0000000000" required>
                    </div>
                    <div class="col-md-6">
                        <label for="pais" class="form-label fw-semibold">Selecciona tu país*</label>
                        <select class="form-select" id="pais" name="pais" required>
                            <option value="" selected disabled>Seleccionar un país</option>
                            <option value="Colombia">Colombia</option>
                            <option value="México">México</option>
                            <option value="Argentina">Argentina</option>
                            <option value="Chile">Chile</option>
                            <option value="Perú">Perú</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="departamento_provincia" class="form-label fw-semibold">Ingresar tu Ciudad / provincia*</label>
                        <input type="text" class="form-control" id="departamento_provincia" name="departamento_provincia" placeholder="Ej. Valle del Cauca / Cali" required>
                    </div>
                    <div class="col-md-6">
                        <label for="rol" class="form-label fw-semibold">Tipo de cuenta*</label>
                        <select class="form-select" id="rol" name="rol" required>
                            <option value="Cliente" selected>Cliente</option>
                            <option value="Agencia">Agencia</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="numero_telefono" class="form-label fw-semibold">Número de teléfono*</label>
                        <input type="tel" class="form-control" id="numero_telefono" name="numero_telefono" placeholder="+57 300 000 0000" required>
                    </div>
                    <div class="col-md-6">
                        <label for="genero" class="form-label fw-semibold">Género*</label>
                        <select class="form-select" id="genero" name="genero" required>
                            <option value="" selected disabled>Seleccionar género</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Otro">Otro / Prefiero no decir</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Correo electrónico*</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com" required>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">Ingresar tu contraseña*</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" minlength="8" required>
                    </div>
                    <div class="col-md-6">
                        <label for="validar_password" class="form-label fw-semibold">Validar tu contraseña*</label>
                        <input type="password" class="form-control" id="validar_password" name="validar_password" placeholder="••••••••••••" minlength="8" required>
                    </div>
                    <div class="col-12 d-flex justify-content-center">
                        <div style="max-width: 450px; width: 100%;">
                            <label for="imagen" class="form-label fw-semibold">Foto de perfil (Opcional)</label>
                            <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                        </div>
                    </div>
                </div>
                <div class="form-check d-flex justify-content-center align-items-center gap-2 my-4">
                    <input class="form-check-input mt-0" type="checkbox" id="terminos" name="terminos" required>
                    <label class="form-check-label" for="terminos">
                        Acepto los <a href="#" class="text-danger text-decoration-none">Términos y Condiciones</a> y la <a href="#" class="text-danger text-decoration-none">Política de Privacidad</a>
                    </label>
                </div>
                <div class="d-grid mx-auto" style="max-width: 450px;">
                    <button type="button" id="btn-registrar" class="btn btn-volaris fw-bold text-uppercase py-2 rounded-3 fs-6">
                        REGISTRARSE
                    </button>
                </div>
                <p class="text-center text-muted my-3">o</p>
                <div class="d-grid mx-auto mb-4" style="max-width: 450px;">
                    <button type="button" id="btn-google" class="btn btn-outline-danger fw-semibold py-2 d-flex align-items-center justify-content-center gap-2 rounded-3">
                        <i class="fab fa-google"></i> CREA TU CUENTA CON GOOGLE
                    </button>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer mt-auto py-4 bg-light text-center text-muted">
        <div class="container">
            <div class="social-links d-flex justify-content-center align-items-center gap-3 mb-3">
                <span class="fw-semibold me-1">Follow us</span>
                <a href="https://www.instagram.com/__mjtx707/" target="_blank" class="social-icon"><i class="fab fa-instagram fs-4"></i></a>
