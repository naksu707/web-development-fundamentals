                        <input type="email" class="form-control border-danger border-opacity-50 text-secondary fs-6 py-2 px-3 rounded-3" id="correo" placeholder="Correo" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control border-danger border-opacity-50 text-secondary fs-6 py-2 px-3 rounded-3" id="contrasena" placeholder="Contraseña" required>
                    </div>
                    <p class="small text-secondary mb-4">
                        ¿Aún no tienes cuenta? <a href="registro.html" class="text-danger text-decoration-none fw-semibold">Regístrate Aquí</a>
                    </p>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-volaris fw-bold text-uppercase py-2 rounded-3 fs-6">
                            Iniciar Sesión
                        </button>
                        <button type="button" class="btn btn-outline-danger fw-bold text-uppercase py-2 rounded-3 fs-6 d-flex align-items-center justify-content-center gap-2">
