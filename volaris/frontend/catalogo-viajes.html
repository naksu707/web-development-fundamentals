<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volaris - Catalogo Viajes</title>
    <link rel="icon" type="image/webp" href="assets/iconos/icon.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/catalogo-viajes.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4 px-lg-5">
            <a href="index.html" class="navbar-brand logo-link d-flex align-items-center gap-2">
                <img src="/volaris/frontend/assets/iconos/icon.png" alt="Logo Volaris" width="35" height="35" class="d-inline-block align-text-top">
                <span class="fw-bold fs-4 text-dark">Volaris</span>
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVolaris" aria-controls="navbarVolaris" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarVolaris">
                <nav class="nav-links ms-auto d-flex flex-column flex-lg-row align-items-center align-items-lg-center justify-content-center justify-content-lg-end text-center text-lg-start gap-3 gap-lg-4 pb-3 pb-lg-0">
                    <a href="/volaris/frontend/viajes.html" class="nav-link-custom active text-nowrap">Explorar Viajes</a>
                    <a href="/volaris/frontend/pqr.html" class="nav-link-custom text-nowrap">Soporte y Reseñas</a>
                    <a href="/volaris/frontend/tendencias.html" class="nav-link-custom text-nowrap">Tendencias</a>
                    <div id="user-session-container" class="ms-lg-2">
                        <a href="login.html" class="btn btn-volaris px-4 fw-semibold text-nowrap" id="btn-login">Iniciar sesión</a>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main class="container my-5">
        <h1 class="fw-bold mb-4">Explorar viajes</h1>
        <div class="row g-4">
            <aside class="col-12 col-lg-3">
                <div class="card border-danger rounded-4 p-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-danger mb-0">Filtros</h5>
                        <button type="button" id="btn-limpiar-filtros" class="btn btn-outline-danger btn-sm rounded-pill px-3">Limpiar filtro</button>
                    </div>
                    <div class="mb-3">
                        <p class="fw-bold text-danger mb-2 small">Lugares</p>
                        <div class="form-check">
                            <input class="form-check-input filtro-lugar" type="checkbox" value="NACIONAL" id="lugar-nacional">
                            <label class="form-check-label small" for="lugar-nacional">Nacional</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-lugar" type="checkbox" value="INTERNACIONAL" id="lugar-internacional">
                            <label class="form-check-label small" for="lugar-internacional">Internacional</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <p class="fw-bold text-danger mb-2 small">Duración del viaje</p>
                        <div class="form-check">
                            <input class="form-check-input filtro-duracion" type="checkbox" value="Pasadía" id="dur-pasadia">
                            <label class="form-check-label small" for="dur-pasadia">Pasadía (1 día)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-duracion" type="checkbox" value="Fin de semana" id="dur-finde">
                            <label class="form-check-label small" for="dur-finde">Fin de semana (2-3 días)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-duracion" type="checkbox" value="Semana completa" id="dur-semana">
                            <label class="form-check-label small" for="dur-semana">Semana completa o más (+5 días)</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <p class="fw-bold text-danger mb-2 small">Categoría o Ambiente</p>
                        <div class="form-check">
                            <input class="form-check-input filtro-categoria" type="checkbox" value="Playa" id="cat-playa">
                            <label class="form-check-label small" for="cat-playa">Playa</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-categoria" type="checkbox" value="Montaña / Bosque" id="cat-montana">
                            <label class="form-check-label small" for="cat-montana">Montaña / Bosque</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-categoria" type="checkbox" value="Ciudad / Cultural" id="cat-ciudad">
                            <label class="form-check-label small" for="cat-ciudad">Ciudad / Cultural</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filtro-categoria" type="checkbox" value="Nieve / Aventura" id="cat-nieve">
                            <label class="form-check-label small" for="cat-nieve">Nieve / Aventura</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <p class="fw-bold text-danger mb-2 small">Rango de precios</p>
                        <div id="histograma-precios" class="d-flex align-items-end mb-0 px-1" style="height: 60px; gap: 2px;">
                        </div>
                        <div class="range-slider-container position-relative mb-3">
                            <div id="slider-track" class="slider-track position-absolute top-50 translate-middle-y"></div>
                            <input type="range" class="range-input position-absolute w-100" id="filtro-precio-min" min="0" max="5000000" step="50000" value="250000">
                            <input type="range" class="range-input position-absolute w-100" id="filtro-precio-max" min="0" max="5000000" step="50000" value="5000000">
                        </div>
                        <div class="row g-2 text-center">
                            <div class="col-6">
                                <small class="text-muted d-block text-start mb-1" style="font-size: 0.75rem;">Mínimo</small>
                                <div class="border rounded-4 px-2 py-1 bg-white shadow-sm">
                                    <input type="text" id="precio-min-display" class="form-control form-control-sm border-0 text-center fw-bold p-0" value="$250.000" readonly>
                                </div>
                            </div>
                            <div class="col-6">
                                <small class="text-muted d-block text-start mb-1" style="font-size: 0.75rem;">Máximo</small>
                                <div class="border rounded-4 px-2 py-1 bg-white shadow-sm">
                                    <input type="text" id="precio-max-display" class="form-control form-control-sm border-0 text-center fw-bold p-0" value="$5.000.000+" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
            <section class="col-12 col-lg-9">
                <div id="contenedor-catalogo" class="row g-4">
                </div>
                <nav class="mt-5 d-flex justify-content-center">
                    <ul class="pagination pagination-sm" id="paginacion-catalogo">
                    </ul>
                </nav>
            </section>
        </div>
    </main>
    <footer class="footer mt-auto py-4 bg-light text-center text-muted">
        <div class="container">
            <div class="social-links d-flex justify-content-center align-items-center gap-3 mb-3">
                <span class="fw-semibold me-1">Follow us</span>
                <a href="https://www.instagram.com/__mjtx707/" target="_blank" class="social-icon"><i class="fab fa-instagram fs-4"></i></a>
                <a href="https://www.linkedin.com/in/mj-ospina707/" target="_blank" class="social-icon"><i class="fab fa-linkedin fs-4"></i></a>
            </div>
            <hr class="w-75 mx-auto my-3 text-secondary opacity-25">
            <div class="footer-info small">
                <p class="mb-1">Cali, Colombia</p>
                <p class="mb-0">&copy; 2026 Doofenshmirtz malvados S.A. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/script.js"></script>
    <script src="js/catalogo-viajes.js"></script>
</body>
</html>
